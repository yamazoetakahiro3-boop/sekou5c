undOn=localStorage.getItem('s5cSound')!=='off';let audioCtx=null;function playTone(ok){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.connect(gain);gain.connect(audioCtx.destination);osc.type=ok?'sine':'triangle';osc.frequency.setValueAtTime(ok?660:220,now);if(ok)osc.frequency.exponentialRampToValueAtTime(880,now+.12);else osc.frequency.exponentialRampToValueAtTime(160,now+.14);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.13,now+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+.22);osc.start(now);osc.stop(now+.24)}catch(e){}}function updateSound(){const b=$('soundToggle');if(b)b.textContent=soundOn?'🔊 効果音 ON':'🔇 効果音 OFF'}let state=JSON.parse(localStorage.getItem('s5cState')||'{}'),level=+localStorage.getItem('s5cLevel')||2,mode='all',idx=0,order=[];const $=id=>document.getElementById(id);$('level').value=level;const cats=[...new Set(Q.map(x=>x.cat))];cats.forEach(c=>$('cat').insertAdjacentHTML('beforeend',`<option>${c}</option>`));function pool(){let a=Q.filter(q=>$('cat').value==='all'||q.cat===$('cat').value);if(mode==='wrong')a=a.filter(q=>['△','×'].includes(state[q.id]?.mark));return a}function refreshOrder(){order=pool();if(idx>=order.length)idx=0;render()}function pickOpts(q){let all=q.opts.map((v,i)=>({v,i}));if(level===4)return all;let wrong=all.filter(x=>x.i!==q.ans);wrong.sort(()=>Math.random()-.5);let arr=[all[q.ans],...wrong.slice(0,level-1)];return arr.sort(()=>Math.random()-.5)}function render(){let q=order[idx];$('card').classList.toggle('hidden',!q);$('empty').classList.toggle('hidden',!!q);if(!q){stats();return}$('meta').innerHTML=`<span class='tag'>${q.cat}</span><span class='tag ${q.kind==='official'?'official':'pred'}'>${q.kind==='official'?'公式過去問':'予想'}</span><span class='tag'>${idx+1}/${order.length}</span><span class='tag'>評価 ${state[q.id]?.mark||'未'}</span>`;$('question').innerHTML=q.stem.replace('（　）',`<span class='blank'>？</span>`);let choices=pickOpts(q);$('choices').innerHTML='';choices.forEach((o,n)=>{let b=document.createElement('button');b.className='choice';b.textContent=`${n+1}. ${o.v}`;b.onclick=()=>answer(q,o.i,b);$('choices').appendChild(b)});$('answer').className='answer';$('answer').innerHTML='';stats()}function answer(q,oi,b){[...$('choices').children].forEach(x=>x.disabled=true);playTone(oi===q.ans);if(oi===q.ans){b.classList.add('correct');state[q.id]={...(state[q.id]||{}),mark:'○'}}else{b.classList.add('wrong');[...$('choices').children].forEach(x=>{if(x.textContent.includes(q.opts[q.ans]))x.classList.add('correct')});let old=state[q.id]?.mark;state[q.id]={...(state[q.id]||{}),mark:old==='×'?'×':'△'}}save();showAnswer(q)}function showAnswer(q){$('answer').classList.add('show');$('answer').innerHTML=`${q.fig?`<div class='figure'>${figs[q.fig]}<div class='figcap'>※理解補助図。試験問題そのものの図ではありません。</div></div>`:''}<h3>正解：${q.opts[q.ans]}</h3><div class='explain'>${q.exp}</div><div class='source'>出典：${q.src}<br>現行確認方針：公式問題は建設業振興基金の公表問題・正答肢を優先。予想問題は提供教材を基礎に、令和7年版の国土交通省「公共建築工事標準仕様書／公共建築改修工事標準仕様書」と改正有無を確認して更新対象とします。</div><div style='display:flex;gap:8px;margin-top:12px'><button class='secondary' onclick="mark('${q.id}','△')">△ 要復習</button><button class='danger' onclick="mark('${q.id}','×')">× 苦手</button><button class='secondary' onclick="mark('${q.id}','○')">○ 定着</button></div>`}function mark(id,m){state[id]={...(state[id]||{}),mark:m};save();render()}window.mark=mark;function save(){localStorage.setItem('s5cState',JSON.stringify(state));localStorage.setItem('s5cLevel',level);stats()}function stats(){let done=Object.values(state).filter(x=>x.mark).length,good=Object.values(state).filter(x=>x.mark==='○').length,w=Object.values(state).filter(x=>['△','×'].includes(x.mark)).length;$('stats').innerHTML=`<span class='pill'>収録 ${Q.length}問</span><span class='pill'>回答済 ${done}</span><span class='pill'>○ ${good}</span><span class='pill'>要復習 ${w}</span><span class='pill'>Level ${level===2?'1':level===3?'2':'3'}</span>`}$('level').onchange=e=>{level=+e.target.value;save();render()};$('cat').onchange=()=>{idx=0;refreshOrder()};$('modeAll').onclick=()=>{mode='all';idx=0;refreshOrder()};$('modeWrong').onclick=()=>{mode='wrong';idx=0;refreshOrder()};$('soundToggle').onclick=()=>{soundOn=!soundOn;localStorage.setItem('s5cSound',soundOn?'on':'off');updateSound()};updateSound();$('next').onclick=()=>{if(order.length){idx=(idx+1)%order.length;render()}};$('prev').onclick=()=>{if(order.length){idx=(idx-1+order.length)%order.length;render()}};$('reveal').onclick=()=>{let q=order[idx];if(q)showAnswer(q)};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');refreshOrder();</script></body></html>
