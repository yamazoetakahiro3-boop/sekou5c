<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><title>施工管理 暗記帳 119問</title><style>:root{--bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#d9dee5;--accent:#2563eb;--ok:#166534;--ng:#991b1b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:980px;margin:auto;padding:20px 14px 80px}a{color:var(--accent);text-decoration:none;font-weight:700}h1{font-size:24px;margin:8px 0}.sub{font-size:13px;color:var(--muted);line-height:1.6}.bars{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;font-size:14px}.active,.primary{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px #0000000d}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0 16px}.progress>div{height:100%;background:var(--accent)}.term{font-size:30px;font-weight:800;text-align:center;margin:24px 0}.prompt{font-weight:700;margin:16px 0 8px}.box{border:1px solid var(--line);background:#fafafa;border-radius:12px;padding:15px;line-height:2.2;font-size:17px}.actions,.ratings{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.hidden{display:none!important}input.cloze{min-width:80px;max-width:230px;padding:4px 6px;margin:0 3px;border:0;border-bottom:2px solid #94a3b8;background:#fff;font-size:16px;text-align:center}input.correct{border-bottom-color:var(--ok);background:#f0fdf4}input.wrong{border-bottom-color:var(--ng);background:#fef2f2}.feedback{font-size:13px;margin-top:8px}.feedback.ok{color:var(--ok)}.feedback.ng{color:var(--ng)}.figure{display:none;margin-top:14px;border:1px solid var(--line);border-radius:14px;background:#fafbfd;padding:10px}.figure.show{display:block}.figure svg{width:100%;height:auto}.figcap{font-size:12px;color:var(--muted);margin-top:6px}.good{background:#ecfdf5}.mid{background:#fffbeb}.bad{background:#fef2f2}.foot{font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px}@media(max-width:600px){.term{font-size:26px}.card{padding:16px}button,select{font-size:13px;padding:9px 10px}.ratings button{flex:1}}</style></head><body><div class="wrap"><a href="/sekou5c/">← 5-C対策へ戻る</a><h1>施工管理 暗記帳</h1><div class="sub"><b id="total"></b>収録｜level1＝1つ穴 → level2＝2つ穴 → level3＝3つ穴 → level4＝4つ穴 → level5＝全文</div><div class="bars"><button id="l1" class="active">level1</button><button id="l2">level2</button><button id="l3">level3</button><button id="l4">level4</button><button id="l5">level5</button><button id="sound">🔊 効果音 ON</button></div><div class="bars"><select id="cat"><option value="ALL">すべての工事区分</option></select><button id="shuffle">シャッフル</button><button id="weak">△・×だけ復習</button><button id="all">全問に戻す</button><button id="reset">評価リセット</button></div><div class="card"><div class="meta"><span id="category"></span><span id="counter"></span></div><div class="progress"><div id="bar"></div></div><div class="term" id="term"></div><div id="clozeArea"><div class="prompt">① 用語の説明</div><div class="box" id="cloze1"></div><div class="actions"><button class="primary" id="check1">答え合わせ</button><button id="hint1">ヒント</button><button id="ans1">模範解答</button></div><div id="feed1" class="feedback"></div><div id="phase2" class="hidden"><div class="prompt">② 施工上留意すべき内容</div><div class="box" id="cloze2"></div><div class="actions" id="a2"><button class="primary" id="check2">答え合わせ</button><button id="hint2">ヒント</button><button id="ans2">模範解答</button></div><div id="feed2" class="feedback"></div></div></div><div id="recallArea" class="hidden"><div class="prompt">① 用語の説明を自力で答えてください</div><div class="actions"><button class="primary" id="speak1">🎙 音声で答える</button><button id="reveal1">模範解答</button></div><div class="box hidden" id="answer1"></div><div id="recall2" class="hidden"><div class="prompt">② 施工上留意すべき内容を自力で答えてください</div><div class="actions"><button class="primary" id="speak2">🎙 音声で答える</button><button id="reveal2">模範解答</button></div><div class="box hidden" id="answer2"></div></div></div><div id="figure" class="figure"></div><div id="ratings" class="ratings hidden"><button class="good" data-rate="○">○ 覚えた</button><button class="mid" data-rate="△">△ あやしい</button><button class="bad" data-rate="×">× 未記憶</button></div></div><div class="foot">補助図は理解のための模式図で、実際の試験問題の図ではありません。法令・基準の変更がある項目は令和8年度向けに順次確認・更新します。</div></div><script src="cards.js"></script><script src="figures.js"></script><script>const cards=window.CARDS||[],figs=window.FIGS||{},$=id=>document.getElementById(id);let level=1,order=cards.map((_,i)=>i),pos=0,activeCat='ALL',ratings=JSON.parse(localStorage.getItem('sekou119ratings')||'{}'),soundOn=localStorage.getItem('sekou119sound')!=='off',ac=null;$('total').textContent='全'+cards.length+'問 ';[...new Set(cards.map(c=>c.category))].forEach(c=>{$('cat').insertAdjacentHTML('beforeend',`<option>${c}</option>`)});function tone(ok){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.connect(g);g.connect(ac.destination);o.frequency.setValueAtTime(ok?660:220,n);o.frequency.exponentialRampToValueAtTime(ok?880:160,n+.12);g.gain.setValueAtTime(.001,n);g.gain.exponentialRampToValueAtTime(.12,n+.02);g.gain.exponentialRampToValueAtTime(.001,n+.2);o.start(n);o.stop(n+.22)}catch(e){}}function candidates(t){let a=[];for(let m of t.matchAll(/\d+(?:[.,/]\d+)?(?:mm|cm|m|㎡|度|°|箇所|か所|本|日|時間|分|段|階|対|％|%)(?:以上|以下|以内|程度)?|[一-龯々ァ-ヶー]{2,10}/g)){let w=m[0];if(!['建物','工事','場合','材料','使用','施工','部分','方法','状態','位置','確認'].includes(w))a.push({text:w,start:m.index,end:m.index+w.length,score:/\d/.test(w)?100:w.length})}a.sort((x,y)=>y.score-x.score);let out=[];for(let x of a){if(out.some(y=>x.start<y.end&&x.end>y.start)||out.some(y=>y.text===x.text))continue;out.push(x);if(out.length===4)break}return out}function cloze(t,id,n){let b=$(id);b.innerHTML='';let s=candidates(t).slice(0,n).sort((a,b)=>a.start-b.start),cur=0;s.forEach(x=>{b.append(document.createTextNode(t.slice(cur,x.start)));let i=document.createElement('input');i.className='cloze';i.dataset.answer=x.text;i.style.width=Math.min(230,Math.max(80,x.text.length*22))+'px';b.append(i);cur=x.end});b.append(document.createTextNode(t.slice(cur)))}function key(i){return i+':'+level}function save(){localStorage.setItem('sekou119ratings',JSON.stringify(ratings))}function setLevels(){for(let i=1;i<=5;i++)$('l'+i).classList.toggle('active',i===level)}function fig(show=false){let c=cards[order[pos]],f=figs[c.term];$('figure').innerHTML=f?f+'<div class="figcap">※理解補助図</div>':'';$('figure').classList.toggle('show',!!f&&show)}function render(){if(!order.length){$('term').textContent='該当する問題がありません';return}let i=order[pos],c=cards[i];setLevels();$('category').textContent=c.category;$('counter').textContent=`${pos+1}/${order.length}`+(ratings[key(i)]?'　評価：'+ratings[key(i)]:'');$('bar').style.width=((pos+1)/order.length*100)+'%';$('term').textContent=c.term;$('feed1').textContent='';$('feed2').textContent='';$('phase2').classList.add('hidden');$('ratings').classList.add('hidden');$('answer1').classList.add('hidden');$('answer2').classList.add('hidden');$('recall2').classList.add('hidden');fig(false);if(level===5){$('clozeArea').classList.add('hidden');$('recallArea').classList.remove('hidden');$('answer1').textContent=c.explanation;$('answer2').textContent=c.caution||'※施工上の留意事項なし'}else{$('recallArea').classList.add('hidden');$('clozeArea').classList.remove('hidden');cloze(c.explanation,'cloze1',level);if(c.caution){cloze(c.caution,'cloze2',level);$('a2').classList.remove('hidden')}else{$('cloze2').textContent='※施工上の留意事項なし';$('a2').classList.add('hidden')}}}function check(id,feed,next){let ins=[...$(id).querySelectorAll('input')],ok=0;ins.forEach(i=>{let g=i.value.normalize('NFKC').replace(/\s/g,'')===i.dataset.answer.normalize('NFKC').replace(/\s/g,'');i.classList.toggle('correct',g);i.classList.toggle('wrong',!g);if(g)ok++});let all=ok===ins.length;$(feed).textContent=all?'全部正解です。':`${ok}/${ins.length} 正解。`;$(feed).className='feedback '+(all?'ok':'ng');tone(all);if(next){$('phase2').classList.remove('hidden');if(!cards[order[pos]].caution)$('ratings').classList.remove('hidden')}else $('ratings').classList.remove('hidden')}function model(id,feed,text,next){[...$(id).querySelectorAll('input')].forEach(i=>{i.value=i.dataset.answer;i.classList.add('correct')});$(feed).innerHTML='<b>模範解答：</b>'+text;fig(true);if(next){$('phase2').classList.remove('hidden');if(!cards[order[pos]].caution)$('ratings').classList.remove('hidden')}else $('ratings').classList.remove('hidden')}function hint(id,feed){let i=[...$(id).querySelectorAll('input')].find(x=>!x.value);$(feed).textContent=i?'ヒント：'+[...i.dataset.answer].slice(0,2).join('')+'…':'未入力の空欄がありません'}$('check1').onclick=()=>check('cloze1','feed1',true);$('check2').onclick=()=>check('cloze2','feed2',false);$('ans1').onclick=()=>model('cloze1','feed1',cards[order[pos]].explanation,true);$('ans2').onclick=()=>model('cloze2','feed2',cards[order[pos]].caution,false);$('hint1').onclick=()=>hint('cloze1','feed1');$('hint2').onclick=()=>hint('cloze2','feed2');for(let i=1;i<=5;i++)$('l'+i).onclick=()=>{level=i;render()};function reveal1(){fig(true);$('answer1').classList.remove('hidden');$('recall2').classList.remove('hidden');if(!cards[order[pos]].caution){$('answer2').classList.remove('hidden');$('ratings').classList.remove('hidden')}}function reveal2(){fig(true);$('answer2').classList.remove('hidden');$('ratings').classList.remove('hidden')}$('reveal1').onclick=reveal1;$('reveal2').onclick=reveal2;function speech(target,after){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('このブラウザでは音声認識が利用できません');return}let r=new SR();r.lang='ja-JP';r.onresult=e=>{$(target).textContent='あなたの回答：'+e.results[0][0].transcript;$(target).classList.remove('hidden')};r.onend=after;r.start()}$('speak1').onclick=()=>speech('answer1',reveal1);$('speak2').onclick=()=>speech('answer2',reveal2);document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{ratings[key(order[pos])]=b.dataset.rate;save();pos=(pos+1)%order.length;render()});$('shuffle').onclick=()=>{order.sort(()=>Math.random()-.5);pos=0;render()};$('weak').onclick=()=>{let x=order.filter(i=>['△','×'].includes(ratings[key(i)]));if(!x.length)return alert('△・×の問題がありません');order=x;pos=0;render()};$('all').onclick=()=>{activeCat='ALL';$('cat').value='ALL';order=cards.map((_,i)=>i);pos=0;render()};$('cat').onchange=e=>{activeCat=e.target.value;order=cards.map((c,i)=>({c,i})).filter(x=>activeCat==='ALL'||x.c.category===activeCat).map(x=>x.i);pos=0;render()};$('reset').onclick=()=>{if(confirm('評価をすべてリセットしますか？')){ratings={};save();render()}};$('sound').onclick=()=>{soundOn=!soundOn;localStorage.setItem('sekou119sound',soundOn?'on':'off');$('sound').textContent=soundOn?'🔊 効果音 ON':'🔇 効果音 OFF'};render();</script></body></html>
