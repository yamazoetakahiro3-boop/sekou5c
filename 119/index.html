<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><title>施工管理 暗記帳 119問</title><style>:root{--bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#d9dee5;--accent:#2563eb;--ok:#166534;--ng:#991b1b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:900px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(90px + env(safe-area-inset-bottom))}a{color:var(--accent);text-decoration:none;font-weight:700}h1{font-size:24px;margin:10px 0 6px}.sub{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:12px}.levelbar,.toolbar,.actions,.ratings{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button,select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;font-size:15px}.active,.primary{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}.good{background:#ecfdf5}.mid{background:#fffbeb}.bad{background:#fef2f2}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px #0000000d}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0 16px}.bar{height:100%;background:var(--accent)}.term{font-size:30px;font-weight:800;text-align:center;margin:24px 0}.prompt{font-weight:700;font-size:17px;margin:16px 0 8px}.box{border:1px solid var(--line);background:#fafafa;border-radius:12px;padding:14px;line-height:2.1;font-size:17px}.hidden{display:none!important}input.cloze{min-width:80px;max-width:220px;padding:4px 6px;margin:0 2px;border:0;border-bottom:2px solid #94a3b8;background:#fff;font-size:16px;text-align:center}input.correct{background:#f0fdf4;border-bottom-color:var(--ok)}input.wrong{background:#fef2f2;border-bottom-color:var(--ng)}.feedback{font-size:14px;margin:8px 0}.ok{color:var(--ok)}.ng{color:var(--ng)}.model{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.8}.speech{background:#eef4ff;border:1px solid #c7d7ff;border-radius:12px;padding:10px;margin:8px 0}.figure{display:none;background:#fafbfd;border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:14px}.figure.show{display:block}.figure svg{width:100%;height:auto}.cap{font-size:12px;color:var(--muted);margin-top:6px}.ratings{justify-content:center}.ratings button{font-weight:700;min-width:110px}.nav{position:fixed;left:0;right:0;bottom:0;background:#ffffffef;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom))}.navin{max-width:900px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav button{min-height:44px}.small{font-size:12px;color:var(--muted)}@media(max-width:600px){.card{padding:16px}.term{font-size:26px}.levelbar button{flex:1 1 28%}.toolbar select{width:100%}.ratings button{flex:1}}</style></head><body><div class="wrap"><a href="/sekou5c/">← 5-C対策へ戻る</a><h1>施工管理 暗記帳 119問</h1><div class="sub">全119問収録｜Level1＝1つ穴 → Level2＝2つ穴 → Level3＝3つ穴 → Level4＝4つ穴 → Level5＝全文想起｜○△×評価・弱点復習・補助図・効果音</div><div class="levelbar" id="levelbar"></div><div class="toolbar"><select id="cat"><option value="ALL">すべての工事区分</option></select><button id="shuffle">シャッフル</button><button id="weak">△・×だけ復習</button><button id="all">全問に戻す</button><button id="sound">🔊 効果音 ON</button></div><div class="card" id="card"><div class="meta"><span id="category"></span><span id="counter"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="term" id="term"></div><div id="clozeArea"><div class="small" id="levelnote"></div><div class="prompt">① 用語の説明</div><div class="box" id="c1"></div><div class="actions"><button class="primary" id="check1">答え合わせ</button><button id="hint1">ヒント</button><button id="ans1">模範解答</button></div><div id="f1" class="feedback"></div><div id="phase2" class="hidden"><div class="prompt">② 施工上留意すべき内容</div><div class="box" id="c2"></div><div class="actions" id="a2"><button class="primary" id="check2">答え合わせ</button><button id="hint2">ヒント</button><button id="ans2">模範解答</button></div><div id="f2" class="feedback"></div></div></div><div id="recall" class="hidden"><div class="prompt">① 用語の説明を自力で答えてください</div><div class="actions"><button class="primary" id="sp1">🎙 音声で答える</button><button id="rv1">模範解答</button></div><div class="speech hidden" id="speech1"></div><div class="box hidden" id="ra1"></div><div id="rphase2" class="hidden"><div class="prompt">② 施工上留意すべき内容を自力で答えてください</div><div class="actions" id="ra2btn"><button class="primary" id="sp2">🎙 音声で答える</button><button id="rv2">模範解答</button></div><div class="speech hidden" id="speech2"></div><div class="box hidden" id="ra2"></div></div></div><div class="figure" id="figure"></div><div class="ratings hidden" id="ratings"><button class="good" data-r="○">○ 覚えた</button><button class="mid" data-r="△">△ あやしい</button><button class="bad" data-r="×">× 未記憶</button></div></div></div><div class="nav"><div class="navin"><button id="prev">← 前へ</button><button id="next">次へ →</button></div></div><script src="data.js"></script><script src="figures.js"></script><script>const cards=window.CARDS,figs=window.FIGS||window.FIGURES||{},$=x=>document.getElementById(x);let level=+(localStorage.s119level||1),cat='ALL',pos=0,order=cards.map((_,i)=>i),ratings=JSON.parse(localStorage.s119ratings||'{}'),soundOn=localStorage.s119sound!=='off',ac=null;function tone(ok){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.connect(g);g.connect(ac.destination);o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(ok?660:220,t);o.frequency.exponentialRampToValueAtTime(ok?900:150,t+.13);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.start(t);o.stop(t+.24)}catch(e){}}for(let i=1;i<=5;i++){let b=document.createElement('button');b.textContent=`Level ${i}${i<5?`（${i}つ穴）`:'（全文）'}`;b.onclick=()=>{level=i;localStorage.s119level=i;render()};b.id='lv'+i;$('levelbar').appendChild(b)}[...new Set(cards.map(c=>c.category))].forEach(c=>$('cat').insertAdjacentHTML('beforeend',`<option>${c}</option>`));const stop=new Set(['の','を','に','へ','で','と','が','は','も','から','まで','より','や','など','等','ため','ために','において','によって','により','として','とともに','また','又は','または','あるいは','かつ','た','て','する','した','して','される','なる','ない','よう','こと','もの','場合','部分','方法','作業','材料','使用','施工','位置','確認','状態','種類','目的','必要','適切','十分','行う','いう','用いる','用いて','設ける']);function spans(text){if(!text)return[];let raw=[];try{let sg=new Intl.Segmenter('ja',{granularity:'word'}),grp='',st=null,en=null,fl=()=>{if(grp){raw.push({text:grp,start:st,end:en});grp='';st=en=null}};for(let z of sg.segment(text)){let w=z.segment;if(!z.isWordLike||stop.has(w)){fl();continue}if(st===null)st=z.index;grp+=w;en=z.index+w.length}fl()}catch(e){for(let m of text.matchAll(/[一-龯々ぁ-んァ-ヶA-Za-z0-9０-９°㎡㎜㎝／/～〜・]{2,16}/g))raw.push({text:m[0],start:m.index,end:m.index+m[0].length})}for(let m of text.matchAll(/\d+(?:[.,/]\d+)?(?:mm|cm|m|㎡|度|°|箇所|か所|本|日|時間|分|段|階|対|％|%)(?:以上|以下|以内|程度)?/g))raw.push({text:m[0],start:m.index,end:m.index+m[0].length,n:1});return raw.filter(x=>x.text.length>=2&&x.text.length<=20).map(x=>({...x,score:(x.n?30:0)+Math.min(x.text.length,10)+(/[ァ-ヶー]/.test(x.text)?5:0)})).sort((a,b)=>b.score-a.score).filter((x,i,a)=>!a.slice(0,i).some(y=>x.start<y.end&&x.end>y.start)).slice(0,4)}function cloze(text,id,n){let box=$(id),ss=spans(text).slice(0,n).sort((a,b)=>a.start-b.start),cur=0;box.innerHTML='';for(let s of ss){box.append(document.createTextNode(text.slice(cur,s.start)));let inp=document.createElement('input');inp.className='cloze';inp.dataset.a=s.text;inp.style.width=Math.min(220,Math.max(82,s.text.length*20))+'px';box.append(inp);cur=s.end}box.append(document.createTextNode(text.slice(cur)))}function norm(x){return (x||'').normalize('NFKC').replace(/\s+/g,'').replace(/[、。,.・]/g,'').replace(/[〜～]/g,'~')}function key(i){return i+':'+level}function save(){localStorage.s119ratings=JSON.stringify(ratings)}function rebuild(){order=cards.map((c,i)=>({c,i})).filter(x=>cat==='ALL'||x.c.category===cat).map(x=>x.i);pos=0;render()}function fig(show=false){let c=cards[order[pos]],f=$('figure');if(figs[c.term]){f.innerHTML=figs[c.term]+'<div class="cap">※理解補助図です。実際の試験問題の図ではありません。</div>';f.classList.toggle('show',show)}else{f.innerHTML='';f.classList.remove('show')}}function render(){if(!order.length)return;let i=order[pos],c=cards[i];for(let x=1;x<=5;x++)$('lv'+x).classList.toggle('active',x===level);$('category').textContent=c.category;$('counter').textContent=`${pos+1}/${order.length}　評価:${ratings[key(i)]||'未'}`;$('bar').style.width=((pos+1)/order.length*100)+'%';$('term').textContent=c.term;$('phase2').classList.add('hidden');$('ratings').classList.add('hidden');$('f1').textContent='';$('f2').textContent='';$('speech1').classList.add('hidden');$('speech2').classList.add('hidden');$('ra1').classList.add('hidden');$('ra2').classList.add('hidden');$('rphase2').classList.add('hidden');$('ra1').textContent=c.explanation;$('ra2').textContent=c.caution||'※施工上留意すべき内容の記載なし';fig(false);if(level===5){$('clozeArea').classList.add('hidden');$('recall').classList.remove('hidden')}else{$('clozeArea').classList.remove('hidden');$('recall').classList.add('hidden');$('levelnote').textContent=`空欄は各文章につき最大${level}個`;cloze(c.explanation,'c1',level);if(c.caution){cloze(c.caution,'c2',level);$('a2').classList.remove('hidden')}else{$('c2').textContent='※施工上留意すべき内容の記載なし';$('a2').classList.add('hidden')}}}function check(id,feed,next){let ins=[...$(id).querySelectorAll('input')],ok=0;ins.forEach(x=>{let g=norm(x.value)===norm(x.dataset.a);x.classList.toggle('correct',g);x.classList.toggle('wrong',!g);if(g)ok++});tone(ok===ins.length);$(feed).textContent=ok===ins.length?'全部正解です。':`${ok}/${ins.length} 正解。`;$(feed).className='feedback '+(ok===ins.length?'ok':'ng');if(next){$('phase2').classList.remove('hidden');if(!cards[order[pos]].caution)$('ratings').classList.remove('hidden')}else $('ratings').classList.remove('hidden')}function model(id,feed,text,next){[...$(id).querySelectorAll('input')].forEach(x=>{x.value=x.dataset.a;x.classList.add('correct')});$(feed).innerHTML=`<div class="model"><b>模範解答：</b>${text||'※記載なし'}</div>`;fig(true);if(next){$('phase2').classList.remove('hidden');if(!cards[order[pos]].caution)$('ratings').classList.remove('hidden')}else $('ratings').classList.remove('hidden')}function hint(id,feed){let x=[...$(id).querySelectorAll('input')].find(x=>!x.value);$(feed).textContent=x?`ヒント：「${[...x.dataset.a].slice(0,2).join('')}…」`:'未入力の空欄がありません。'}$('check1').onclick=()=>check('c1','f1',true);$('check2').onclick=()=>check('c2','f2',false);$('ans1').onclick=()=>model('c1','f1',cards[order[pos]].explanation,true);$('ans2').onclick=()=>model('c2','f2',cards[order[pos]].caution,false);$('hint1').onclick=()=>hint('c1','f1');$('hint2').onclick=()=>hint('c2','f2');function rv1(){fig(true);$('ra1').classList.remove('hidden');$('rphase2').classList.remove('hidden');if(!cards[order[pos]].caution){$('ra2btn').classList.add('hidden');$('ra2').classList.remove('hidden');$('ratings').classList.remove('hidden')}else $('ra2btn').classList.remove('hidden')}function rv2(){fig(true);$('ra2').classList.remove('hidden');$('ratings').classList.remove('hidden')}$('rv1').onclick=rv1;$('rv2').onclick=rv2;function speech(id,after){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('このブラウザでは音声認識を利用できません。');return}let r=new SR(),b=$(id);r.lang='ja-JP';b.classList.remove('hidden');b.textContent='聞き取り中…';r.onresult=e=>b.textContent='あなたの回答：'+[...e.results].map(x=>x[0].transcript).join('');r.onend=()=>setTimeout(after,200);r.start()}$('sp1').onclick=()=>speech('speech1',rv1);$('sp2').onclick=()=>speech('speech2',rv2);document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ratings[key(order[pos])]=b.dataset.r;save();pos=(pos+1)%order.length;render()});$('prev').onclick=()=>{pos=(pos-1+order.length)%order.length;render()};$('next').onclick=()=>{pos=(pos+1)%order.length;render()};$('shuffle').onclick=()=>{order.sort(()=>Math.random()-.5);pos=0;render()};$('weak').onclick=()=>{let x=order.filter(i=>['△','×'].includes(ratings[key(i)]));if(!x.length)return alert('このLevelで△・×の問題はありません。');order=x;pos=0;render()};$('all').onclick=()=>{cat='ALL';$('cat').value='ALL';rebuild()};$('cat').onchange=e=>{cat=e.target.value;rebuild()};$('sound').onclick=()=>{soundOn=!soundOn;localStorage.s119sound=soundOn?'on':'off';$('sound').textContent=soundOn?'🔊 効果音 ON':'🔇 効果音 OFF'};$('sound').textContent=soundOn?'🔊 効果音 ON':'🔇 効果音 OFF';render();</script></body></html>
